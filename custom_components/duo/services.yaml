set_preference:
  name: Définir une préférence
  description: Enregistre le niveau d'intérêt (0 à 5) d'un partenaire pour une catégorie d'activités.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    partner:
      name: Partenaire
      description: Prénom du partenaire concerné.
      required: true
      selector:
        text:
    category:
      name: Catégorie
      description: Catégorie d'activités (preliminaires, sensoriel, massage, jeu_de_role, communication, intensite_plus).
      required: true
      selector:
        select:
          options:
            - preliminaires
            - sensoriel
            - massage
            - jeu_de_role
            - communication
            - intensite_plus
    rating:
      name: Note
      description: Niveau d'intérêt de 0 (pas du tout) à 5 (beaucoup).
      required: true
      selector:
        number:
          min: 0
          max: 5
          step: 1

set_accessories:
  name: Définir les accessoires
  description: Met à jour la liste des accessoires disponibles pour le couple.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    accessories:
      name: Accessoires
      description: >-
        Liste des identifiants du catalogue prédéfini possédés par le couple
        (voir custom_components/duo/accessories.py, ex. bandeau, plume,
        vibromasseur). La carte et les options de l'intégration proposent
        une case à cocher pour chaque accessoire du catalogue.
      required: true
      selector:
        object:

set_mood:
  name: Définir l'humeur
  description: >-
    Met à jour l'humeur du soir d'un partenaire, avec les accessoires qu'il
    propose, et prévient l'autre partenaire sur tous ses appareils.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    partner:
      name: Partenaire
      description: >-
        Prénom du partenaire concerné. Laisser vide pour utiliser la personne
        associée au compte Home Assistant qui appelle le service. Chacun ne
        peut modifier que sa propre humeur.
      required: false
      selector:
        text:
    mood:
      name: Humeur
      description: Humeur du soir.
      required: true
      selector:
        select:
          options:
            - pas_ce_soir
            - douceur
            - curieux
            - nouveaute
            - torride
    accessories:
      name: Accessoires proposés
      description: >-
        Accessoires que ce partenaire aimerait utiliser ce soir. Ils sont
        cités dans la notification envoyée à l'autre.
      required: false
      selector:
        object:
    new_idea:
      name: Idée nouvelle
      description: >-
        Uniquement avec l'humeur « nouveaute » : ce que le partenaire aurait
        envie d'essayer. Utiliser __unknown__ pour « je ne sais pas encore ».
      required: false
      selector:
        text:

request_suggestion:
  name: Demander une suggestion
  description: Propose une nouvelle activité à réaliser.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    turn:
      name: Tour de
      description: Prénom du partenaire qui réalisera l'activité (aléatoire si omis).
      required: false
      selector:
        text:

respond_suggestion:
  name: Répondre à une suggestion
  description: Accepte ou décline la suggestion en cours.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    response:
      name: Réponse
      description: accepted ou declined.
      required: true
      selector:
        select:
          options:
            - accepted
            - declined

start_timer:
  name: Démarrer le minuteur
  description: (Re)démarre le minuteur pour l'activité en cours.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    minutes:
      name: Durée (minutes)
      description: Durée personnalisée en minutes (sinon durée aléatoire dans la plage de l'activité).
      required: false
      selector:
        number:
          min: 1
          max: 60
          step: 1

stop_timer:
  name: Arrêter le minuteur
  description: Arrête le minuteur en cours.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo

reset_session:
  name: Réinitialiser la session
  description: Efface la suggestion et le minuteur en cours (le profil est conservé).
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo

clear_profile:
  name: Réinitialiser le profil du couple
  description: Efface le profil complet du couple (préférences, accessoires, historique).
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo