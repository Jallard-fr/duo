set_preference:
  name: Définir une préférence
  description: >-
    Enregistre le niveau d'intérêt (0 à 5) d'un partenaire pour une
    catégorie d'activités. Si une personne Home Assistant est associée à
    chaque partenaire, seul le partenaire concerné peut modifier sa propre
    note.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    partner:
      name: Partenaire
      description: Prénom du partenaire concerné.
      required: true
      selector:
        text:
    category:
      name: Catégorie
      description: Catégorie d'activités.
      required: true
      selector:
        select:
          options:
            - preliminaires
            - sensoriel
            - massage
            - jeu_de_role
            - communication
            - intensite_plus
            - resolution
    rating:
      name: Note
      description: >-
        Niveau d'intérêt de 0 à 5. 0 = catégorie exclue (jamais proposée),
        sauf si le partenaire a activé "braver ses interdits".
      required: true
      selector:
        number:
          min: 0
          max: 5
          step: 1

set_accessories:
  name: Définir les accessoires
  description: Met à jour la liste des accessoires disponibles pour le couple.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    accessories:
      name: Accessoires
      description: >-
        Liste des identifiants du catalogue prédéfini possédés par le couple
        (voir custom_components/duo/accessories.py, ex. bandeau, plume,
        vibromasseur). La carte et les options de l'intégration proposent
        une case à cocher pour chaque accessoire du catalogue.
      required: true
      selector:
        object:

set_brave_taboos:
  name: Braver ses interdits
  description: >-
    Active ou désactive, pour un partenaire, le fait de redevenir éligible
    aux catégories qu'il a mises à 0 et aux activités récemment déclinées,
    en vue des prochaines suggestions.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    partner:
      name: Partenaire
      description: Prénom du partenaire concerné.
      required: true
      selector:
        text:
    enabled:
      name: Activé
      description: true pour braver ses interdits, false pour revenir au comportement normal.
      required: true
      selector:
        boolean:

set_practice_limit:
  name: Définir une limite de pratique
  description: >-
    Enregistre la réponse d'un partenaire à une question fermée du
    questionnaire de limites (voir custom_components/duo/const.py,
    PRACTICE_*). Chacun ne peut définir que ses propres limites.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    partner:
      name: Partenaire
      description: Prénom du partenaire qui répond.
      required: true
      selector:
        text:
    key:
      name: Clé
      description: >-
        Identifiant de la question, ex. oral_donne, oral_recoit,
        anal_donne, anal_recoit, discipline_donne, discipline_recoit,
        liens_donne, liens_recoit, jouets_usage.
      required: true
      selector:
        text:
    answer:
      name: Réponse
      description: oui, a_voir ou non. "non" exclut l'activité correspondante.
      required: true
      selector:
        select:
          options:
            - value: oui
              label: Oui
            - value: a_voir
              label: À voir
            - value: non
              label: Non

set_mood:
  name: Définir l'humeur
  description: >-
    Met à jour l'humeur du soir d'un partenaire, avec les accessoires qu'il
    propose, et prévient l'autre partenaire sur tous ses appareils.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    partner:
      name: Partenaire
      description: >-
        Prénom du partenaire concerné. Laisser vide pour utiliser la personne
        associée au compte Home Assistant qui appelle le service. Chacun ne
        peut modifier que sa propre humeur.
      required: false
      selector:
        text:
    mood:
      name: Humeur
      description: Humeur du soir.
      required: true
      selector:
        select:
          options:
            - pas_ce_soir
            - douceur
            - curieux
            - nouveaute
            - torride
    accessories:
      name: Accessoires proposés
      description: >-
        Accessoires que ce partenaire aimerait utiliser ce soir. Ils sont
        cités dans la notification envoyée à l'autre.
      required: false
      selector:
        object:
    new_idea:
      name: Idée nouvelle
      description: >-
        Uniquement avec l'humeur « nouveaute » : ce que le partenaire aurait
        envie d'essayer. Utiliser __unknown__ pour « je ne sais pas encore ».
      required: false
      selector:
        text:

set_lingerie:
  name: Déclarer sa tenue
  description: >-
    Indique la lingerie que la partenaire a enfilée ce soir (voir
    accessories.py, catégorie lingerie). Tant que la liste n'est pas vide,
    les activités qui proposent de s'habiller ne sont plus suggérées pour
    son tour, et l'autre partenaire reçoit un message adapté à la
    combinaison choisie. Envoyer une liste vide annule la déclaration.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    partner:
      name: Partenaire
      description: >-
        Prénom du partenaire concerné. Laisser vide pour utiliser la personne
        associée au compte Home Assistant qui appelle le service. Chacun ne
        peut déclarer que sa propre tenue.
      required: false
      selector:
        text:
    items:
      name: Lingerie portée
      description: >-
        Identifiants du catalogue prédéfini (catégorie lingerie) portés ce
        soir, ex. lingerie_fine, masque, tenue_legere.
      required: true
      selector:
        object:

set_position_limit:
  name: Définir une limite de posture
  description: >-
    Enregistre la réponse d'un partenaire à une question du questionnaire de
    postures : accepte-t-il/elle de RECEVOIR quelque chose (une caresse, une
    fessée...) dans cette posture (allongé, à quatre pattes...). Chacun ne
    peut définir que ses propres limites.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    partner:
      name: Partenaire
      description: Prénom du partenaire qui répond.
      required: true
      selector:
        text:
    position:
      name: Posture
      description: Identifiant de la posture (voir POSITION_* dans const.py).
      required: true
      selector:
        select:
          options:
            - position_allonge
            - position_quatre_pattes
            - position_penche_avant
            - position_debout
            - position_assis
            - position_genoux
    answer:
      name: Réponse
      description: oui, a_voir ou non. "non" exclut les activités dans cette posture.
      required: true
      selector:
        select:
          options:
            - value: oui
              label: Oui
            - value: a_voir
              label: À voir
            - value: non
              label: Non

set_phase:
  name: Changer de phase
  description: >-
    Passe directement à une phase précise de la progression guidée
    (Excitation, Préliminaires, Intense, Résolution), en avant ou en
    arrière. Réinitialise la progression de la phase (tours, pénétration
    garantie) comme le ferait un passage automatique.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    phase:
      name: Phase
      description: Phase cible.
      required: true
      selector:
        select:
          options:
            - value: phase_excitation
              label: Excitation
            - value: phase_preliminaires
              label: Préliminaires
            - value: phase_intense
              label: Intense
            - value: phase_resolution
              label: Résolution

end_encounter:
  name: Terminer le rapport
  description: >-
    Marque la soirée comme terminée : réinitialise l'engagement, l'humeur et
    la session en cours des deux partenaires, une fois que le couple a
    terminé.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo

request_suggestion:
  name: Demander une suggestion
  description: >-
    Propose une nouvelle activité à réaliser. En cas de refus, jusqu'à 4
    nouvelles propositions sont faites automatiquement avant de laisser la
    main. 3 activités acceptées par personne dans une phase font passer
    automatiquement à la phase suivante.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    turn:
      name: Tour de
      description: Prénom du partenaire qui réalisera l'activité (aléatoire si omis).
      required: false
      selector:
        text:
    phase:
      name: Phase
      description: >-
        Moment du rapport visé (excitation, préliminaires, intense,
        résolution). Laisser vide pour utiliser la phase de la progression
        guidée en cours.
      required: false
      selector:
        select:
          options:
            - value: phase_excitation
              label: Excitation
            - value: phase_preliminaires
              label: Préliminaires
            - value: phase_intense
              label: Intense
            - value: phase_resolution
              label: Résolution

respond_suggestion:
  name: Répondre à une suggestion
  description: Accepte ou décline la suggestion en cours.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    response:
      name: Réponse
      description: accepted ou declined.
      required: true
      selector:
        select:
          options:
            - accepted
            - declined

start_timer:
  name: Démarrer le minuteur
  description: (Re)démarre le minuteur pour l'activité en cours.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo
    minutes:
      name: Durée (minutes)
      description: Durée personnalisée en minutes (sinon durée fixe propre à l'activité).
      required: false
      selector:
        number:
          min: 1
          max: 60
          step: 1

stop_timer:
  name: Arrêter le minuteur
  description: Arrête le minuteur en cours.
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo

reset_session:
  name: Réinitialiser la session
  description: Efface la suggestion et le minuteur en cours (le profil est conservé).
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo

clear_profile:
  name: Réinitialiser le profil du couple
  description: Efface le profil complet du couple (préférences, accessoires, historique).
  fields:
    entry_id:
      name: Intégration
      description: Identifiant de l'entrée de configuration Duo concernée.
      required: true
      selector:
        config_entry:
          integration: duo